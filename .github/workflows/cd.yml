name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    permissions:
      contents: 'read'
      id-token: 'write'

    steps: 
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
      
      - name: Set up Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Build
        run: scripts/buildprod.sh
      
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: 'Use gcloud CLI'
        run: 'gcloud info'

      - name: GCloud Builds Submit
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/named-sequencer-503814-m5/notely-ar-repo/calmsea1234/notely:latest .

      - name: Migrate up
        run: ./scripts/migrateup.sh 

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/named-sequencer-503814-m5/notely-ar-repo/calmsea1234/notely:latest --region us-central1 --allow-unauthenticated --project named-sequencer-503814-m5 --max-instances=4